name: Build iOS & Windows

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: simple_live_app
        run: flutter build ios --release --no-codesign

      - name: Pack unsigned IPA
        working-directory: simple_live_app
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos
          zip -q -r ios_no_sign.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

  build-windows:
    name: Build Windows ZIP
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build Windows
        working-directory: simple_live_app
        run: flutter build windows --release

      - name: Zip Release folder
        working-directory: simple_live_app
        shell: pwsh
        run: |
          $candidates = @(
            "build\windows\x64\runner\Release",
            "build\windows\runner\Release"
          )
          $release = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $release) {
            Write-Error "Release 目录不存在，Windows 编译可能失败"
            Get-ChildItem -Recurse build\windows -ErrorAction SilentlyContinue | Select-Object -First 50
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "..\dist" | Out-Null
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            & 7z a -tzip "..\dist\simple_live_windows.zip" ".\$release\*"
          } else {
            Compress-Archive -Path ".\$release\*" -DestinationPath "..\dist\simple_live_windows.zip" -Force
          }
          Get-Item "..\dist\simple_live_windows.zip"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/simple_live_windows.zip
